<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ff">
  <meta name="description" content="Messy — a private, aesthetic messenger.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Messy — Messages</title>
</head>

<body>
  <div id="app">

    <!-- AUTH -->
    <section id="authView" class="screen">
      <div class="auth-card">

        <div class="logo">💬</div>

        <h1>Messy</h1>
        <p class="muted">Your private little corner to talk.</p>

        <div class="tabs">
          <button class="tab active" data-auth="login">Log in</button>
          <button class="tab" data-auth="signup">Create account</button>
        </div>

        <form id="authForm">
          <input
            id="email"
            type="email"
            placeholder="Email"
            required
            autocomplete="email"
          >

          <input
            id="password"
            type="password"
            placeholder="Password"
            required
            minlength="6"
            autocomplete="current-password"
          >

          <input
            id="username"
            class="signup-only hidden"
            type="text"
            placeholder="Username"
            maxlength="24"
            autocomplete="nickname"
          >

          <button class="primary" type="submit" id="authButton">
            Log in
          </button>
        </form>

        <p id="authMsg" class="error"></p>
      </div>
    </section>


    <!-- MESSENGER -->
    <section id="chatView" class="hidden">

      <!-- Conversations -->
      <aside class="sidebar">

        <header class="side-head">
          <div>
            <h2>Messages</h2>
            <span id="meLabel" class="muted"></span>
          </div>

          <button
            id="logoutBtn"
            class="icon-btn"
            title="Log out"
            aria-label="Log out"
          >↪</button>
        </header>

        <div class="search-wrap">
          <input
            id="userSearch"
            placeholder="Search people..."
            autocomplete="off"
            aria-label="Search users"
          >
        </div>

        <div id="userList" class="user-list"></div>

      </aside>


      <!-- Active conversation -->
      <main class="chat">

        <header class="chat-head">

          <button
            id="backBtn"
            class="icon-btn mobile-only"
            title="Back"
            aria-label="Back to messages"
          >‹</button>

          <div class="avatar" id="chatAvatar">?</div>

          <div class="chat-person">
            <strong id="chatName">Select a user</strong>
            <span id="presence">Choose someone to chat</span>
          </div>

        </header>


        <div id="messages" class="messages">
          <div class="empty">
            Select a person to start chatting 👋
          </div>
        </div>


        <div id="typing" class="typing hidden">
          typing…
        </div>


        <!-- Message composer -->
        <div class="composer">

          <input
            id="imageInput"
            type="file"
            accept="image/*"
            class="hidden"
          >

          <button
            id="imageBtn"
            class="icon-btn"
            title="Send image"
            aria-label="Send image"
          >🖼️</button>

          <button
            id="recordBtn"
            class="icon-btn"
            title="Voice message"
            aria-label="Voice message"
          >🎤</button>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Message..."
            disabled
            aria-label="Message"
          ></textarea>

          <button
            id="sendBtn"
            class="send"
            disabled
            aria-label="Send message"
          >➤</button>

        </div>

        <div id="uploadStatus" class="upload-status"></div>

      </main>

    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
